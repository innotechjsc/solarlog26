version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: solarlogger-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: solarlogger123
      MONGO_INITDB_DATABASE: solarlogger
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - solarlogger-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: solarlogger-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: solarlogger123
      ME_CONFIG_MONGODB_URL: mongodb://admin:solarlogger123@mongodb:27017/
      ME_CONFIG_SERVER_BASEPORT: 8082
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - solarlogger-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  solarlogger-network:
    driver: bridge

